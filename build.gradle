 'default/node':'default/phase_liquid','default/developer1':'default/node','default/developer2':'default/developer1',
 'default/developer3':'default/developer2','default/phasegen':'default/phase_liquid','default/solargen':'default/phasegen',
 'default/windgen':'default/solargen','default/crystal':null,'default/terminal':null,
 'electromaster/lv1':null,'electromaster/lv2':'electromaster/lv1','electromaster/lv3':'electromaster/lv2','electromaster/lv4':'electromaster/lv3','electromaster/lv5':'electromaster/lv4',
 'electromaster/arc_gen':null,'electromaster/attack_creeper':'electromaster/arc_gen','electromaster/mag_movement':'electromaster/attack_creeper','electromaster/body_intensify':'electromaster/mag_movement','electromaster/mine_detect':'electromaster/body_intensify','electromaster/thunder_bolt':'electromaster/mine_detect','electromaster/railgun':'electromaster/thunder_bolt','electromaster/thunder_clap':'electromaster/railgun',
 'meltdowner/lv1':null,'meltdowner/lv2':'meltdowner/lv1','meltdowner/lv3':'meltdowner/lv2','meltdowner/lv4':'meltdowner/lv3','meltdowner/lv5':'meltdowner/lv4',
 'meltdowner/rad_intensify':null,'meltdowner/light_shield':'meltdowner/rad_intensify','meltdowner/meltdowner':'meltdowner/light_shield','meltdowner/mine_ray':'meltdowner/meltdowner','meltdowner/jet_engine':'meltdowner/mine_ray','meltdowner/electron_missile':'meltdowner/jet_engine',
 'teleporter/lv1':null,'teleporter/lv2':'teleporter/lv1','teleporter/lv3':'teleporter/lv2','teleporter/lv4':'teleporter/lv3','teleporter/lv5':'teleporter/lv4',
 'teleporter/threatening_teleport':null,'teleporter/critical_attack':'teleporter/threatening_teleport','teleporter/ignore_barrier':'teleporter/critical_attack','teleporter/flashing':'teleporter/ignore_barrier','teleporter/mastery':'teleporter/flashing',
 'vecmanip/lv1':null,'vecmanip/lv2':'vecmanip/lv1','vecmanip/lv3':'vecmanip/lv2','vecmanip/lv4':'vecmanip/lv3','vecmanip/lv5':'vecmanip/lv4',
 'vecmanip/ground_shock':null,'vecmanip/dir_blast':'vecmanip/ground_shock','vecmanip/storm_wing':'vecmanip/dir_blast','vecmanip/blood_retro':'vecmanip/storm_wing','vecmanip/vec_reflection':'vecmanip/blood_retro'
]
tasks.register('generateLegacyAdvancements') {
    def output = layout.buildDirectory.dir('generated/legacyAdvancements')
    outputs.dir(output)
    doLast {
        output.get().asFile.deleteDir()
        legacyAdvancementParents.each { id, parent ->
            def file = output.get().file("data/academy/advancement/legacy/${id}.json").asFile
            file.parentFile.mkdirs()
            def parts=id.split('/'); def legacyKey=parts[0]=='default'?"achievement.ac_${parts[1]}":"achievement.ac_${parts[0]}.${parts[1]}"
            def icons=['default/phase_liquid':'academy:matter_unit_phase_liquid','default/matrix1':'academy:matrix','default/matrix2':'academy:mat_core_0','default/node':'academy:node_basic','default/developer1':'academy:developer_portable','default/developer2':'academy:dev_normal','default/developer3':'academy:dev_advanced','default/phasegen':'academy:phase_gen','default/solargen':'academy:solar_gen','default/windgen':'academy:windgen_main','default/crystal':'academy:crystal_low','default/terminal':'academy:terminal_installer']
            def icon=icons[id] ?: "academy:factor_${parts[0]}"
            def json = [criteria:[earned:[trigger:'minecraft:impossible']], requirements:[['earned']],
                        display:[icon:[id:icon],title:[translate:legacyKey],
                                 description:[translate:legacyKey+'.desc'],frame:'task',show_toast:true,announce_to_chat:true,hidden:false]]
            if (parent != null) json.parent = "academy:legacy/${parent}"
            file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/legacyAdvancements'))
tasks.named('processResources').configure { dependsOn tasks.named('generateLegacyAdvancements') }

// Three binary resources used by the pre-installed 1.12.2 About app were
// absent from the Mohist tree. Keep the official visuals in reviewable base64
// source files (with obsolete third-party solicitation metadata removed) and
// decode them reproducibly for IDE runs and release jars. The two tutorial-
// window aliases retain identical official bytes but changed names during an
// earlier port, so expose both canonical 1.12.2 names.
def legacy112AssetOutput = layout.buildDirectory.dir('generated/legacy112Assets')
def legacy112EncodedAssets = [
        [source: file('src/legacyAssets/about_bg.png.b64'),
         target: 'assets/academy/textures/guis/about/bg.png'],
        [source: file('src/legacyAssets/about_button_glow.png.b64'),
         target: 'assets/academy/textures/guis/about/button_glow.png'],
        [source: file('src/legacyAssets/about_icon.png.b64'),
         target: 'assets/academy/textures/guis/apps/about/icon.png']
]
def legacy112TutorialAliases = [
        [source: file('src/main/resources/assets/academy/textures/guis/window_tutorialLeft.png'),
         target: 'window_tutorial_left.png'],
        [source: file('src/main/resources/assets/academy/textures/guis/window_tutorialRight.png'),
         target: 'window_tutorial_right.png']
]
tasks.register('generateLegacy112Assets') {
    inputs.files(legacy112EncodedAssets.collect { it.source })
    inputs.files(legacy112TutorialAliases.collect { it.source })
    outputs.dir(legacy112AssetOutput)
    doLast {
        def root = legacy112AssetOutput.get().asFile
        root.deleteDir()
        legacy112EncodedAssets.each { spec ->
            def target = new File(root, spec.target)
            target.parentFile.mkdirs()
            def encoded = spec.source.text.replaceAll('\\s', '')
            target.bytes = java.util.Base64.decoder.decode(encoded)
        }
        legacy112TutorialAliases.each { spec ->
            def target = new File(root, "assets/academy/textures/guis/${spec.target}")
            target.parentFile.mkdirs()
            java.nio.file.Files.copy(spec.source.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
sourceSets.main.resources.srcDir(legacy112AssetOutput)
tasks.named('processResources').configure { dependsOn tasks.named('generateLegacy112Assets') }

// License and provenance must travel with the binary, not only the source tree.
tasks.named('jar', Jar).configure {
    from('LICENSE') { into '' }
    from('NOTICE') { into '' }
    from('README.md') { into '' }
    from('BUILD-INFO.txt') { into '' }
    def buildInfo = file('BUILD-INFO.txt')
    if (!buildInfo.exists()) {
        throw new GradleException('BUILD-INFO.txt is required; run scripts/generate-build-info.ps1 before Gradle.')
    }
    def identity = new Properties()
    buildInfo.withInputStream { identity.load(it) }
    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'AcademyCraft-Source-Tree-SHA256': identity.getProperty('Source-Tree-SHA256'),
                'AcademyCraft-MohistMC-Upstream-SHA': identity.getProperty('MohistMC-Upstream-SHA'),
                'AcademyCraft-Legacy-Upstream-SHA': identity.getProperty('Legacy-Upstream-SHA'),
                'AcademyCraft-Evaluation-Date': identity.getProperty('Evaluation-Date'),
                'AcademyCraft-JUnit-Tests': identity.getProperty('JUnit-Tests'),
                'AcademyCraft-GameTests': identity.getProperty('GameTests'),
                'AcademyCraft-Client-Machine-Gate': identity.getProperty('Client-Machine-Gate'),
                'AcademyCraft-Packaged-Server-Gate': identity.getProperty('Packaged-Server-Gate', 'NOT VERIFIED for this build'),
                'AcademyCraft-Packaged-Client-Gate': identity.getProperty('Packaged-Client-Gate', 'NOT VERIFIED for this build')
        )
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.warnings = false
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
